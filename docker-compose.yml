services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:?}@postgres:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
    command: ['npx', 'payload', 'migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  payload:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:?}@postgres:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      SERVICE_FQDN_PAYLOAD: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media:/app/media
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: payload
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  media:
