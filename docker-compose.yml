services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:?}@postgres:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      SERVICE_FQDN_PAYLOAD: 3000
    depends_on:
      - postgres
    volumes:
      - media:/app/media
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: payload
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  media:
